name: Probe source reachability

# Fills in a 2x2: {residential, datacenter} x {plain HTTP, headless browser}.
#
# ops#4 concluded "IP reputation, not fingerprinting - browser flags will not fix it"
# from a single cell of that grid: a headless Chromium run on a datacenter IP. Measured
# 2026-09-05 from a residential IP, the browser is ALSO 403'd by TickPick while plain
# HTTP to the same URL, from the same machine, in the same minute, returns 1.4MB with 31
# distinct prices. Headless-ness alone is sufficient to trigger a block, so attributing
# the Actions failure to the IP was confounded - the two variables were never separated.
#
# So this workflow now runs BOTH probes from the runner. The plain-HTTP job is the cell
# nobody has ever measured, and it decides whether the collector can run free in CI
# after all (ops#16).
#
# One polite logged-out request per platform. Never authenticated - the account holds
# the season tickets. Screenshots are uploaded so browser verdicts can be checked by eye
# rather than trusted from a heuristic.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * 1" # weekly Monday, to catch changes in blocking posture

permissions:
  contents: read

jobs:
  # The never-measured cell. No browser, so nothing to fingerprint - if this returns
  # real content, the datacenter IP is not the problem and ops#4's conclusion needs
  # rewriting.
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verdict logic self-test
        run: python3 scripts/probe_sources.py --self-test

      - name: Probe over plain HTTP
        run: python3 scripts/probe_sources.py --label actions-http | tee http-probe.txt
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Plain HTTP from a GitHub Actions runner" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat http-probe.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no output)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Runners have sudo, so --with-deps works here even though it fails locally.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe
        run: node scripts/probe_browser.mjs --label actions --out probe-out
        continue-on-error: true

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-actions
          path: probe-out/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          if [[ -f probe-out/actions-results.json ]]; then
            echo "## Reachability from a GitHub Actions runner" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Platform | Verdict | Status | Prices seen |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          d = json.load(open('probe-out/actions-results.json'))
          for r in d['results']:
              print(f\"| {r['platform']} | {r.get('verdict','?')} | {r.get('status')} | {r.get('uniquePrices',0)} |\")
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "Probe produced no results file." >> $GITHUB_STEP_SUMMARY
          fi
